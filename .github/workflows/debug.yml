name: Debug OpenAI API Key

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Debug environment variables
        run: env

      - name: Check API Key Availability
        run: echo "OPENAI_API_KEY is set"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Install OpenAI package
        run: pip install --upgrade openai

      - name: Run OpenAI script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Checking API key: $OPENAI_API_KEY"  # This will be masked in logs
          python my_openai_script.py
